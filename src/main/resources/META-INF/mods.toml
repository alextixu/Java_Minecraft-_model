# See https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml
# References: https://github.com/MinecraftForge/MDKExamples

modLoader="javafml"
loaderVersion="[66,)"
# Forge 66 refuses to load a mod whose license is empty ("Missing License Information"), so this field must stay.
# "All Rights Reserved" grants no license; it is what applies anyway when nothing is granted.
license="All Rights Reserved"
#issueTrackerURL="https://github.com/MyOrganization/MyMod/" #optional
#clientSideOnly=true #optional, default=false

[[mods]]
modId="mobarmory"
version="1.0.0"
displayName="Mob Armory"
#updateJSONURL="https://example.com/updates.json" #optional
#displayURL="https://example.com/" #optional
#credits="" #optional
authors="alextixu" #optional
#displayTest="MATCH_VERSION" #optional, default=MATCH_VERSION when not clientSideOnly, else IGNORE_ALL_VERSION

description='''An extensible stat system: register new stats (crit chance, dodge chance, ...) that every mob gets,
and weapons and armor that change the wearer's stats (a heavy sword slows you down).'''

[[dependencies.mobarmory]] #recommended
    modId="forge"
    mandatory=true
    versionRange="[66,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.mobarmory]] #recommended
    modId="minecraft"
    mandatory=true
    versionRange="[26.3,26.4,)"
    ordering="NONE"
    side="BOTH"
