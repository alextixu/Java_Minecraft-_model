// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.0.0'
group = 'io.github.alextixu.mobarmory'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

// System tests (GameTest) live in their own source set so they never ship in the mod jar.
// Their test instances are data-pack registry entries, and Minecraft marks any such entry from a
// non-vanilla pack as experimental, which made every world show an "experimental settings" warning.
// The source set is a separate test-only mod (src/gametest/resources/META-INF/mods.toml) that only the
// gameTestServer run puts on the classpath; the jar task packs main only.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestAnnotationProcessor.extendsFrom annotationProcessor
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'mobarmory'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            // Its own folder, emptied before every run (cleanGameTestRun below): the tests always start from the
            // shipped default weapons, never from weapon files a player edited in run/config (R2b, decision O14).
            workingDir = layout.projectDirectory.dir('run-gametest')
            // No web admin in test runs, so they never fight a running game for its port (R6, B14).
            systemProperty 'mobarmory.web', 'false'
            // JUnit-style XML with every system test's result (see docs/boundary/04-behavior-report.md)
            args '--report', 'gametest-report.xml'
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'mobarmory', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'

    // Unit tests for the Minecraft-independent core (see docs/boundary/)
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// ForgeGradle makes one set of run tasks per source set. The game tests need the gametest source set's run
// (runGametestGameTestServer: Mob Armory plus the test-only mod), so `gradlew runGameTestServer` forwards there
// instead of starting a server without the tests.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'runGametestGameTestServer'
    enabled = false
}

def gameTestRunDir = layout.projectDirectory.dir('run-gametest').asFile
def cleanGameTestRun = tasks.register('cleanGameTestRun', Delete) {
    delete gameTestRunDir
    doLast { gameTestRunDir.mkdirs() }
}
// Section E: the test server starts with two stat files a player could have written (src/gametest/config), so the
// game tests check stats added by files. With the stats folder already there, the built-in stats come from code (Q5 A).
def prepareGameTestRun = tasks.register('prepareGameTestRun', Copy) {
    dependsOn cleanGameTestRun
    from layout.projectDirectory.dir('src/gametest/config')
    into layout.projectDirectory.dir('run-gametest/config')
}
tasks.matching { it.name == 'runGametestGameTestServer' }.configureEach {
    dependsOn cleanGameTestRun, prepareGameTestRun
}

// `build` also compiles the game tests, so a broken test is caught even without running the test server.
tasks.named('check') {
    dependsOn tasks.named('gametestClasses')
}

// With merge-source-sets, classes and resources share one output folder per source set. When compileJava was
// restored from the build cache in a clean build, that folder ended up without any classes (2026-11-06), which
// would also produce an empty mod jar. These tasks are fast, so they always run instead of using the cache.
tasks.withType(JavaCompile).configureEach { outputs.cacheIf { false } }
tasks.withType(ProcessResources).configureEach { outputs.cacheIf { false } }

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}
